name: Build and Release
on:
  push:
    branches:
      - main
    # Запускаем релиз, когда отправляем тег версии (например v1.0.0, v1.0.1)
    tags:
      - 'v*'
  # Оставляем возможность запустить сборку вручную через вкладку Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Даем право workflow создавать релизы
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # Создаем Release и загружаем .jar файл
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          name: "FreezeMod ${{ github.ref_name }}"
          body: |
            ## 🎉  Релиз мода FreezeMod
            - Версия: `${{ github.ref_name }}`
            - Совместимость: NeoForge 1.21.11 (21.11.42)
            - Автоматическая сборка через GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}